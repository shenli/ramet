server:
  token_env: RAMET_TENANT_A_TOKEN
  max_inflight: 32
worker:
  data: /var/lib/ramet/tenant-a
  backend: copy
  max_executions: 64
  max_pools: 16
  max_idle_executions: 16
  idle_ttl: 5m
  min_free_disk_bytes: 1073741824
  source_roots: [] # Explicit absolute directories allowed for capture.
  git_repositories: [] # Exact repository URLs or local paths allowed for import.
