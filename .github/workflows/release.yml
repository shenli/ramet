name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make check
      - run: bash scripts/build-release.sh
      - run: python -m pip install build
      - run: python -m build sdk/python
      - name: Private planning guard
        run: test -z "$(git ls-files docs/ramet-marketing-internal.md docs/phase-1-plan.md docs/phase-2-plan.md)"
      - uses: actions/upload-artifact@v7
        with:
          name: ramet-release-candidates
          path: |
            .test-cache/release/*
            sdk/python/dist/*
          include-hidden-files: true
