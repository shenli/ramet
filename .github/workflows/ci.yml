name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make check
      - run: go test -run '^$' -fuzz FuzzManifestPaths -fuzztime 10s ./engine
      - run: ./bin/ramet demo --concurrency 8 --iterations 100
      - name: Keep private planning files out of releases
        run: test -z "$(git ls-files docs/ramet-marketing-internal.md docs/phase-1-plan.md docs/phase-2-plan.md)"
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python -m pip install build
      - run: python -m build sdk/python
      - run: docker build -t ramet:ci .
      - name: Container lifecycle smoke test
        run: docker run --rm --entrypoint ramet ramet:ci demo --concurrency 4 --iterations 20
      - run: make build
      - run: docker pull python:3.12-slim-bookworm
      - name: Docker adapter lifecycle
        run: RAMET_TEST_DOCKER=1 PYTHONPATH=sdk/python:sdk/python/tests python -m unittest test_integration.IntegrationTests.test_docker_timeout_isolation_and_recycle test_integration.IntegrationTests.test_docker_stops_on_expired_lease test_integration.IntegrationTests.test_docker_bounds_combined_output_and_recycles -v
      - name: Selective persistence and verified reconstruction
        run: PYTHONPATH=sdk/python python examples/persistence/run.py --docker
      - name: Pinned image and document session recovery
        run: |
          docker build -t ramet-document-session:ci examples/document_session
          SESSION_IMAGE=$(docker image inspect ramet-document-session:ci --format '{{.Id}}')
          PYTHONPATH=sdk/python python examples/document_session/run.py --image "$SESSION_IMAGE"
      - name: Best-of-N coding workflow
        run: |
          PYTHONPATH=sdk/python python examples/best_of_n/run.py --output .test-cache/coding-demo
          git -C .test-cache/coding-demo/source apply --check ../winner.patch
  durable-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose -p ramet-phase1-test -f compose.integration.yaml up -d --build --wait
      - name: Enable native FUSE tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: Native FUSE lifecycle
        run: RAMET_TEST_FUSE=1 go test -race -count=1 -timeout=3m -v -run TestLazy ./engine
      - run: make build
      - name: Python lifecycle on FUSE
        run: RAMET_TEST_BACKEND=lazy PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -v
      - name: Generate document checkpoint fixtures
        run: |
          python -m pip install uv
          uv run --locked --script scripts/generate-artifact-fixtures.py --output .test-cache/artifact-fixtures
      - name: Durable storage, document recovery, and FUSE
        run: RAMET_TEST_FUSE=1 RAMET_ARTIFACT_FIXTURES="$PWD/.test-cache/artifact-fixtures" ./scripts/test-integration.sh
      - name: Document session on an empty replacement worker
        env:
          RAMET_DATABASE_URL: postgres://ramet_test:ramet-local-integration-only@127.0.0.1:17432/ramet_phase1_test?sslmode=disable
          RAMET_S3_ACCESS_KEY: ramet_test
          RAMET_S3_SECRET_KEY: ramet-local-integration-only
        run: |
          docker build -t ramet-document-session:ci examples/document_session
          SESSION_IMAGE=$(docker image inspect ramet-document-session:ci --format '{{.Id}}')
          PYTHONPATH=sdk/python python examples/document_session/run.py --image "$SESSION_IMAGE" \
            --worker-config examples/document_session/providers.test.yaml
      - if: always()
        run: docker compose -p ramet-phase1-test -f compose.integration.yaml down
